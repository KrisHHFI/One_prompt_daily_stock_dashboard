plugins {
    id 'com.android.application'
}

android {
    namespace 'app.stockdashboard'
    compileSdk 35

    defaultConfig {
        applicationId 'app.stockdashboard'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// No third-party dependencies: plain HTTP + Android's built-in JSON parser.
